[project]
name = "ardia-cli"
version = "0.0.0.dev0"
description = "The ardia command: drive a running Ardia from Python."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "websockets==16.1.1",
]

[project.scripts]
ardia = "ardia_cli.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
