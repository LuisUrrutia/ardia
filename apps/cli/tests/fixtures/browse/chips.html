<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fixture Chips</title>
<style>
  .chip input { position: absolute; width: 0; height: 0; opacity: 0; }
  .chip span { display: inline-block; padding: 6px 12px; border: 1px solid #888; border-radius: 12px; }
  .chip input:checked + span { background: #224; color: #fff; }
</style>
</head>
<body>
<label class="chip"><input type="checkbox" id="hvac" checked><span>HVAC</span></label>
<label class="chip"><input type="checkbox" id="plumbing" checked><span>Plumbing</span></label>
<pre id="report">{}</pre>
<script>
  const show = () => {
    document.getElementById("report").textContent = JSON.stringify({ hvac: document.getElementById("hvac").checked, plumbing: document.getElementById("plumbing").checked });
  };
  document.addEventListener("change", show);
  show();
</script>
</body>
</html>
