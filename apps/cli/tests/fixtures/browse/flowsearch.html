<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fixture Shop</title></head>
<body>
<main>
<h1>Shop</h1>
<label for="q">Search</label> <input id="q" name="q" type="search">
<button id="go" type="button">Search</button>
<ul id="results"></ul>
</main>
<script>
document.getElementById("go").addEventListener("click", async () => {
  const q = document.getElementById("q").value;
  const response = await fetch(`flowdata/${encodeURIComponent(q)}.json?q=${encodeURIComponent(q)}`, { headers: { accept: "application/json" } });
  const data = await response.json();
  document.getElementById("results").innerHTML = data.results.map((item) => `<li>${item.title}: $${item.price}</li>`).join("");
});
</script>
</body>
</html>
