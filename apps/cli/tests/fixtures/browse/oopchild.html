<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; }
  #box { width: 300px; height: 80px; border: 0; background: #ddd; }
</style>
</head>
<body>
<button id="box">I'm here</button>
<script>
  document.getElementById("box").addEventListener("click", () => parent.postMessage("box", "*"));
</script>
